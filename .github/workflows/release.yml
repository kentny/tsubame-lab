# 版の番号のタグ（例: v0.1.0）を付けると、配布するファイルを作ってリリースページに置く。
# このファイルは、ツール専用の公開リポジトリに移したときに有効になる（講座設計のリポジトリでは動かない）。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test
      - run: mise run dist "${GITHUB_REF_NAME#v}"
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes "OSごとのファイルと、チェックサムの一覧（SHA256SUMS.txt）です。"
        env:
          GH_TOKEN: ${{ github.token }}
